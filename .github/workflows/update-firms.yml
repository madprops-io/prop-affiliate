name: Update firm data

on:
  push:
    branches: [main]
    paths:
      - 'scripts/automation/**'
      - '.github/workflows/update-firms.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: firm-data-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/automation/requirements.txt
      - run: python -m unittest discover -s scripts/automation -p 'test_*.py'
      - name: Collect current official product data
        run: python scripts/automation/collect.py
      - name: Summarize source coverage and blocked firms
        if: always()
        run: |
          if test -f data/firm-updates.json; then python scripts/automation/source_health.py; fi
      - name: Preserve run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firm-update-report
          path: |
            data/firm-updates.json
            data/source-health.md
          retention-days: 14
      - name: Publish verified updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/firm-updates.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh verified firm data'
          # A simultaneous commit can advance main after checkout.
          # Retry by replaying this data-only commit onto the latest main.
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase -X theirs origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          echo 'Could not publish verified data after four attempts' >&2
          exit 1
      - name: Prepare human approval proposal
        run: python scripts/automation/propose_approvals.py
      - name: Generate readable pricing review only for pending approvals
        run: |
          if git diff --quiet -- data/approved-firm-data.json; then
            rm -f data/pricing-review.md
          else
            python scripts/automation/pricing_review.py
          fi
      - name: Create reviewable approval pull request
        id: approval_pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            data/approved-firm-data.json
            data/pricing-review.md
          branch: automation/approve-firm-prices
          delete-branch: true
          title: 'Review verified MadProps pricing changes'
          commit-message: 'Propose approved pricing baseline'
          body: |
            Open **data/pricing-review.md** under Files changed for a table of old vs new prices, codes, source links and expiration dates.\n            Review each proposed price and discount against its official source.
            **Merge this PR to approve and retain the new baseline.**
            Promotions retain their source expiration date and do not become permanent discounts.
            GitHub can email subscribers when this PR is opened or updated.
      - name: Email pricing approval via Resend
        if: ${{ steps.approval_pr.outputs.pull-request-operation == 'created' || steps.approval_pr.outputs.pull-request-operation == 'updated' }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
          APPROVAL_TO_EMAIL: caldwell.tj@gmail.com
          APPROVAL_PR_URL: ${{ steps.approval_pr.outputs.pull-request-url }}
          APPROVAL_PR_OPERATION: ${{ steps.approval_pr.outputs.pull-request-operation }}
        run: python scripts/automation/send_approval_email.py
