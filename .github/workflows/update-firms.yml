name: Update firm data

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firm-data-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/automation/requirements.txt
      - run: python -m unittest discover -s scripts/automation -p 'test_*.py'
      - name: Collect current official product data
        run: python scripts/automation/collect.py
      - name: Preserve run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firm-update-report
          path: data/firm-updates.json
          retention-days: 14
      - name: Publish verified updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/firm-updates.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh verified firm data'
          git push origin HEAD:main
