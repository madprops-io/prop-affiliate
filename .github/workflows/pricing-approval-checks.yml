name: Pricing approval checks

on:
  pull_request:
    paths:
      - 'app/**'
      - 'lib/**'
      - 'data/**'
      - 'scripts/automation/**'
      - 'tests/**'
      - 'next.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  # Bot approval PRs are opened with GITHUB_TOKEN, which never triggers
  # pull_request workflows. Check the open approval PR after each bot run.
  workflow_run:
    workflows: ['Update firm data']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: pricing-approval-checks-${{ github.event.pull_request.number || github.event_name }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      APPROVAL_BRANCH: automation/approve-firm-prices
      STATUS_CONTEXT: Pricing approval checks
    steps:
      - name: Select commit to check
        id: target
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_run ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            sha=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$APPROVAL_BRANCH" --state open --json headRefOid --jq '.[0].headRefOid // ""')
            if [ -z "$sha" ]; then
              echo "No open approval PR; nothing to check."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            echo "base=main" >> "$GITHUB_OUTPUT"
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$sha" -f state=pending \
              -f context="$STATUS_CONTEXT" -f description='Running tests and data validation' \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
          else
            echo "base=$GITHUB_BASE_REF" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.target.outputs.skip != 'true'
        with:
          ref: ${{ steps.target.outputs.sha || github.sha }}
      - uses: actions/setup-node@v4
        if: steps.target.outputs.skip != 'true'
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        if: steps.target.outputs.skip != 'true'
        with:
          python-version: '3.12'
      - name: Validate approved pricing data
        if: steps.target.outputs.skip != 'true'
        env:
          BASE_REF: ${{ steps.target.outputs.base }}
        run: |
          base="$RUNNER_TEMP/base-approved.json"
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git show FETCH_HEAD:data/approved-firm-data.json > "$base" 2>/dev/null || rm -f "$base"
          python scripts/automation/validate_approved_data.py --base "$base" | tee "$RUNNER_TEMP/validation.txt"
          status=${PIPESTATUS[0]}
          { echo '### Approved pricing data validation'; echo '```'; cat "$RUNNER_TEMP/validation.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - if: steps.target.outputs.skip != 'true'
        run: npm ci
      - if: steps.target.outputs.skip != 'true'
        run: npm test
      - if: steps.target.outputs.skip != 'true'
        run: npm run typecheck
      - if: steps.target.outputs.skip != 'true'
        run: npm run lint
      - if: steps.target.outputs.skip != 'true'
        run: python -m pip install -r scripts/automation/requirements.txt
      - if: steps.target.outputs.skip != 'true'
        run: python -m unittest discover -s scripts/automation -p 'test_*.py'
      - if: steps.target.outputs.skip != 'true'
        run: npm run build
      - name: Report result on the approval PR
        if: always() && steps.target.outputs.sha != ''
        env:
          SHA: ${{ steps.target.outputs.sha }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = success ]; then state=success; text='Tests, build and data validation passed'
          else state=failure; text='Checks failed - do not merge; see run log'; fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" \
            -f context="$STATUS_CONTEXT" -f description="$text" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
