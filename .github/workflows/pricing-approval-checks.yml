name: Pricing approval checks

on:
  push:
    branches:
      - 'feature/approval-baseline-workflow'
  pull_request:
    paths:
      - 'lib/approvedUpdates.ts'
      - 'lib/firmData.ts'
      - 'scripts/automation/**'
      - 'tests/approvedUpdates.test.mjs'
      - '.github/workflows/update-firms.yml'
      - '.github/workflows/pricing-approval-checks.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: python -m pip install -r scripts/automation/requirements.txt
      - run: python -m unittest discover -s scripts/automation -p 'test_*.py'
      - run: npm run build
